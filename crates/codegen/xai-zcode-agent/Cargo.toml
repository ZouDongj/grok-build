[package]
name = "xai-zcode-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "acp::Agent backed by the ZCode kernel (app-server protocol): full grok-build TUI on the ZCode brain"

[dependencies]
ureq = { version = "2", features = ["json"] }
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
xai-acp-lib = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
# Session deletion writes to the kernel's own store (~/.zcode/cli/db) — the
# app-server protocol has no delete method. Same pinned version as
# xai-grok-dashboard-store (bundled = self-contained SQLite).
rusqlite = { version = "0.37", features = ["bundled"] }
# Shared credential store values are sealed as `enc:v1:<iv>.<tag>.<cipher>`
# (AES-256-GCM, key = sha256 of ZCODE_CREDENTIAL_SECRET or the kernel's
# deterministic machine fallback) — decrypt before handing keys to the kernel.
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
